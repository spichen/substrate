name: publish-ghcr

on:
  workflow_dispatch:
    inputs:
      gateway_only:
        description: Build the pinned gateway with startup egress support
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !inputs.gateway_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve immutable image version
        run: echo "IMAGE_TAG=v0.5.0-alpha2-shared.g${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Validate source and lifecycle
        env:
          REQUIRE_DOCKER: "1"
        run: |
          env -u NO_COLOR go test -short -p 2 ./...
          go test -p 2 ./cmd/ateapi/internal/controlapi/functionaltest ./cmd/ateapi/internal/store/atepg
          git diff --check

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          IMAGE_REPOSITORY: ghcr.io/spichen/substrate
        run: |
          set -o errexit -o nounset -o pipefail
          for component in ateapi atecontroller atelet ateom-gvisor ateom-microvm podcertcontroller atenet credential-provider/kubernetes-secrets; do
            echo "building ${component}"
            image="${component##*/}"
            image="${image/ateom-/ateworker-}"
            KO_DOCKER_REPO="${IMAGE_REPOSITORY}/${image}" \
            ./hack/run-tool.sh ko build \
              --tags "${IMAGE_TAG}" \
              --ldflags "-X=github.com/agent-substrate/substrate/internal/version.Version=${IMAGE_TAG}" \
              --platform linux/amd64,linux/arm64 \
              --bare \
              "./cmd/${component}"
          done

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push Helm charts
        env:
          HELM_EXPERIMENTAL_OCI: "1"
          CHART_REPOSITORY: oci://ghcr.io/spichen/substrate/helm
        run: |
          set -o errexit -o nounset -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
          CHART_VERSION="${IMAGE_TAG#v}"
          APP_VERSION="${IMAGE_TAG}"
          package_dir="${RUNNER_TEMP}/helm-packages"
          mkdir -p "${package_dir}"
          helm package charts/substrate-crds \
            --destination "${package_dir}" \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}"
          helm package charts/substrate \
            --destination "${package_dir}" \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}"
          helm package charts/substrate-podcert \
            --destination "${package_dir}" \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}"
          helm push "${package_dir}/substrate-crds-${CHART_VERSION}.tgz" "${CHART_REPOSITORY}"
          helm push "${package_dir}/substrate-${CHART_VERSION}.tgz" "${CHART_REPOSITORY}"
          helm push "${package_dir}/substrate-podcert-${CHART_VERSION}.tgz" "${CHART_REPOSITORY}"

  gateway:
    if: ${{ inputs.gateway_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      JEMALLOC_SYS_WITH_LG_PAGE: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: agentgateway/agentgateway
          ref: 168b05d62828efd96bea286bceaa8a03cdde2aea
          path: gateway
      - name: Apply startup authorization fix
        working-directory: gateway
        run: git apply ../hack/agentgateway/startup-egress.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway
      - name: Test actor identity and lifecycle authorization
        working-directory: gateway
        run: cargo test --locked -p agentgateway --lib http::substrate::egress_actor_resolution::tests
      - name: Build gateway
        working-directory: gateway
        run: |
          export VERSION="substrate-startup-${GITHUB_SHA:0:12}"
          export GIT_REVISION="168b05d62828efd96bea286bceaa8a03cdde2aea+${GITHUB_SHA}"
          cargo build --locked --release -p agentgateway-app
          target/release/agentgateway --version
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ARM64 gateway for the cluster
        run: |
          cp gateway/target/release/agentgateway hack/agentgateway/agentgateway
          docker buildx build --platform linux/arm64 --push \
            --tag "ghcr.io/spichen/substrate/agentgateway:startup-g${GITHUB_SHA:0:12}" \
            hack/agentgateway
